<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>
<link rel="stylesheet" href="./practice/css/style.css">
</head>

<body>

    <div class="calculator">
        <div class="display" id="display">0</div>
    
        <div class="buttons">
            <button onclick="clearDisplay()" class="clear">C</button>
            <button onclick="append('/')">÷</button>
            <button onclick="append('*')">×</button>
            <button onclick="append('-')">-</button>
    
            <button onclick="append('7')">7</button>
            <button onclick="append('8')">8</button>
            <button onclick="append('9')">9</button>
            <button onclick="append('+')">+</button>
    
            <button onclick="append('4')">4</button>
            <button onclick="append('5')">5</button>
            <button onclick="append('6')">6</button>
            <button onclick="append('.')">.</button>
    
            <button onclick="append('1')">1</button>
            <button onclick="append('2')">2</button>
            <button onclick="append('3')">3</button>
            <button onclick="calculate()" class="equal">=</button>
    
            <button onclick="append('0')" style="grid-column: span 4;">0</button>
        </div>
    </div>

    <div class="fullscreen-result" id="fullscreenResult" aria-hidden="true">
        <video id="resultVideo" src="./practice/assets/naging_kayo_bah_.mp4" playsinline loop></video>
        <button type="button" class="close-result" id="closeResult" aria-label="Close fullscreen result">×</button>
    </div>
    

<script src="./practice/js/script.js"></script>

</body>
</html>
